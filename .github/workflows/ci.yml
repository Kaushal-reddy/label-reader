name: CI

# Every push to main, every pull request, by hand, and as the first step of a
# release (release.yml calls this workflow).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  checks:
    name: Lint, privacy guard, API schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install
        run: pip install -r requirements-erp.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check --output-format=github .

      # The photos, truth.csv, outputs and the asset register's data hold real
      # serial numbers, and the detector's weights have an unknown licence.
      # .gitignore keeps them out; this catches a `git add -f` or a new path.
      - name: No private data in the repository
        run: |
          bad=$( {
            git ls-files photos | grep -vx 'photos/.gitkeep'
            git ls-files truth.csv output data photos_original trained_model models
            git ls-files | grep -iE '\.(jpe?g|png|heic|webp|sqlite|db|pt|pth|onnx)$'
          } || true )
          if [ -n "$bad" ]; then
            echo "::error::Private or generated files are tracked:"; echo "$bad"; exit 1
          fi
          echo "No photos, truth files, outputs, databases or model weights are tracked."

      # docs/erp_openapi.json is generated from the mock ERP's code; fail if
      # someone changed an endpoint and forgot to regenerate it.
      - name: API schema is up to date
        run: |
          python -m label_reader.erp.mock_erp openapi
          git diff --exit-code -- docs/erp_openapi.json \
            || { echo "::error::Run 'python -m label_reader.erp.mock_erp openapi' and commit docs/erp_openapi.json"; exit 1; }

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Tesseract and ZBar: the native programs pip can't install (HOW_TO_RUN.md, Setup without Docker).
      - name: Native dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libzbar0 libgl1
      - name: Native dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract zbar
      - name: Native dependencies (Windows)
        if: runner.os == 'Windows'
        # ZBar ships inside pyzbar, which needs the Visual C++ 2013 runtime.
        run: choco install tesseract vcredist2013 --no-progress -y

      - name: Install
        run: pip install -r requirements.txt -r requirements-erp.txt -r requirements-dev.txt

      - name: Setup check (OpenCV, ZBar, zxing-cpp, Tesseract both ways)
        run: python -m scripts.check_setup

      - name: Tests
        run: >-
          python -m pytest -ra --junitxml=junit.xml
          --cov=label_reader --cov-report=term --cov-report=xml

      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        shell: bash
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("coverage.xml").getroot()
          print(f"### Coverage: {float(root.get('line-rate')) * 100:.0f}% of lines in label_reader\n")
          print("| Module | Lines covered |\n|---|---|")
          for c in sorted(root.iter("class"), key=lambda c: c.get("filename")):
              print(f"| `{c.get('filename')}` | {float(c.get('line-rate')) * 100:.0f}% |")
          EOF

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: |
            junit.xml
            coverage.xml
          if-no-files-found: ignore

  pipeline:
    name: Pipeline + ERP end to end (synthetic photos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Native dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr libzbar0 libgl1
      - name: Install
        run: pip install -r requirements.txt -r requirements-erp.txt

      - name: Make the synthetic dataset (fake serials only)
        run: python -m scripts.make_synthetic_dataset photos/synthetic

      # Every stage's command-line entry point, in the order HOW_TO_RUN.md gives.
      - name: Stage 2 - baseline
        run: python -m label_reader.baseline photos/synthetic
      - name: Stage 3 - barcode variant matrix
        run: python -m label_reader.barcode_reader photos/synthetic
      - name: Stage 4 - label finding
        run: python -m label_reader.label_finder photos/synthetic
      - name: Stage 5 - OCR comparison
        run: python -m label_reader.ocr_reader photos/synthetic
      - name: Stage 6 - the pipeline
        run: python -m label_reader.validate photos/synthetic
      - name: Stage 7 - evaluation
        run: python -m label_reader.evaluate photos/synthetic
      - name: Stage 8 - analysis
        run: python -m label_reader.analyze photos/synthetic
      - name: Decoder experiment
        run: python -m scripts.zxing_experiment photos/synthetic

      - name: Stage 9 - ERP end to end, with injected failures
        run: python -m scripts.erp_e2e photos/synthetic

      - name: Results in the job summary
        if: always()
        run: |
          f=output/synthetic/evaluation/summary.md
          if [ -f "$f" ]; then { echo "## Pipeline on the synthetic photos"; cat "$f"; } >> "$GITHUB_STEP_SUMMARY"; fi

      # Only synthetic photos and fake serials in here, so it's safe to upload.
      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipeline-output
          path: output/synthetic/
          retention-days: 14

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: pip install build==1.6.1 && python -m build
      - name: Install the wheel in a clean venv and import it
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install "$(ls dist/*.whl)[erp]"
          cd /tmp && /tmp/venv/bin/python -c "
          import label_reader, label_reader.erp.mock_erp, label_reader.erp.erp_client, label_reader.erp.post_to_erp
          print('installed', label_reader.__file__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14

  docker:
    name: Docker images + compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build the app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: app
          tags: label-reader/label-reader-app:latest
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build the mock ERP image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: mock-erp
          tags: label-reader/label-reader-mock-erp:latest
          load: true
          # The mock ERP copies the demo manifest from the app stage, so the
          # app's cache saves rebuilding it.
          cache-from: |
            type=gha,scope=app
            type=gha,scope=mock-erp
          cache-to: type=gha,scope=mock-erp,mode=max

      - name: No real photos or serials inside the images
        run: |
          for img in label-reader/label-reader-app label-reader/label-reader-mock-erp; do
            docker run --rm --entrypoint sh "$img" -c \
              'for p in truth.csv photos output data trained_model; do [ ! -e "/app/$p" ] || { echo "found /app/$p"; exit 1; }; done'
          done

      - name: Setup check inside the app image
        run: docker run --rm label-reader/label-reader-app python -m scripts.check_setup

      - name: Pipeline inside the app image (demo photos)
        run: |
          docker run --rm label-reader/label-reader-app python -m label_reader.validate demo | tee validate.log
          grep -E "^Accepted: .*wrong: 0\)" validate.log

      - name: docker compose up (app + mock ERP with the demo job)
        run: docker compose up --no-build --wait --wait-timeout 120
      - name: Both services answer
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:8501/_stcore/health
          curl -fsS -X POST http://localhost:8000/oauth/token -H 'Content-Type: application/json' \
            -d '{"client_id":"label-reader","client_secret":"dev-secret-change-me"}' -o token.json
          token=$(python3 -c "import json; print(json.load(open('token.json'))['access_token'])")
          curl -fsS http://localhost:8000/api/v1/jobs -H "Authorization: Bearer $token" | grep -q JOB-DEMO
          echo "ERP has the demo job; the app is healthy."
      - name: Service logs
        if: always()
        run: docker compose logs --no-color
      - name: docker compose down
        if: always()
        run: docker compose down -v
