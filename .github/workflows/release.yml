name: Release

# Push a version tag to release:   git tag v0.2.0 && git push origin v0.2.0
# The tag must match `version` in pyproject.toml. Runs the full CI first, then:
#   - a GitHub Release with auto-generated notes and the wheel + sdist attached
#   - Docker images on GitHub's container registry, for amd64 and arm64:
#       ghcr.io/<owner>/label-reader-app:<version> and :latest
#       ghcr.io/<owner>/label-reader-mock-erp:<version> and :latest
#     each with a signed build-provenance attestation
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Tag matches pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version"; exit 1
          fi

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/ci.yml

  github-release:
    name: GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: pip install build==1.6.1 && python -m build
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes \
            --title "Label Reader $GITHUB_REF_NAME"

  docker:
    name: Docker image (${{ matrix.target }})
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        target: [app, mock-erp]
    steps:
      - uses: actions/checkout@v7
      # Registry paths must be lowercase; the owner name may not be.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/label-reader-${{ matrix.target }}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=label-reader-${{ matrix.target }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: |
            type=gha,scope=release-app
            type=gha,scope=release-${{ matrix.target }}
          cache-to: type=gha,scope=release-${{ matrix.target }},mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
