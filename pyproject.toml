[project]
name = "label-reader"
version = "0.1.0"
description = "Read serial numbers and product barcodes from photos of equipment labels, and post them to an asset-recording system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Pratham Nayak" }, { name = "Kaushal Reddy" }]
# Exact, tested versions are pinned in requirements.txt / requirements-erp.txt.
dependencies = [
    "matplotlib>=3.11",
    "numpy>=2.5",
    "opencv-python>=5.0",
    "pandas>=3.0",
    "pytesseract>=0.3.13",
    "pyzbar>=0.1.9",
    "streamlit>=1.66",
    "zxing-cpp>=3.1.1",
]

[project.optional-dependencies]
erp = ["fastapi>=0.156", "httpx>=0.28", "uvicorn>=0.54"]
test = ["pytest>=9.1"]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["label_reader*"]

[tool.pytest.ini_options]
# Tests import label_reader from the repo root without installing it.
pythonpath = ["."]
testpaths = ["tests"]
